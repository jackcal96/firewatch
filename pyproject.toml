[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firewatch"
version = "0.1.0"
description = "Fire and smoke detection from RTSP camera feeds using YOLO object detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "openhands-sdk>=1.0",
]

[project.scripts]
firewatch = "firewatch.cli:main"

[tool.setuptools.packages.find]
include = ["firewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: tests that load real model weights (deselect with '-m \"not model\"')",
]
